<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Your existing <head> content remains unchanged -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NIM Regenin Registry{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        #wrapper { min-height: 100vh; }
        #sidebar-wrapper {
            min-width: 250px;
            max-width: 250px;
            transition: margin-left 0.3s;
        }
        #wrapper.toggled #sidebar-wrapper {
            margin-left: -250px;
        }
        #page-content-wrapper { width: 100%; }
        .sidebar-heading { font-size: 1.2rem; }
        .list-group-item { border: none; }
        .dropdown-menu { position: static !important; float: none; box-shadow: none; }
        .dropdown-item:hover { background-color: #343a40; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="d-flex" id="wrapper">
    <!-- Include the Sidebar -->
    {% include 'includes/sidebar.html' %}

    <!-- Page Content -->
    <div id="page-content-wrapper">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container-fluid">
                <button class="btn btn-primary" id="menu-toggle">
                    <i class="bi bi-list"></i>
                </button>

                <div class="ms-auto d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <span class="me-3 text-muted">Hello, <strong>{{ user.username }}</strong></span>
                        <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container-fluid p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sidebar Toggle -->
<script>
    document.getElementById("menu-toggle").addEventListener("click", function(e) {
        e.preventDefault();
        document.getElementById("wrapper").classList.toggle("toggled");
    });
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
