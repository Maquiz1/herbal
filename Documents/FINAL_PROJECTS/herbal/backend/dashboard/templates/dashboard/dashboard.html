{% extends "base.html" %}

{% block content %}

<div class="row">

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body text-center">

                <h2>{{ total_subjects }}</h2>

                <p>Total Subjects</p>

            </div>

        </div>

    </div>

</div>

<br>

<div class="card">

    <div class="card-header">

        Recent Subjects

    </div>

    <div class="card-body">

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>Subject ID</th>
                    <th>Site</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                {% for subject in subjects %}

                <tr>

                    <td>{{ subject.subject_id }}</td>

                    <td>{{ subject.site }}</td>

                    <td>{{ subject.status }}</td>

                </tr>

                {% empty %}

                <tr>

                    <td colspan="3">No subjects available</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
